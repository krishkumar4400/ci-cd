name: Demo CI Env Secrets

on:
    workflow_dispatch:
    push:

# global (workflow) level env
env:
    GLOBAL_APP_ENV: demo_global_env

jobs:
    build:
        runs-on: ubuntu-latest

        # job level env
        env:
            JOB_APP_ENV: demo_job_env

        steps:
            - name: Say Hello
              run: echo "Hello from second workflow"

            - name: Install
              # step level env
              env:
                  APP_ENV: demo
                  PORT: 3000
                  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
                  MONGO_URI: ${{secrets.MONGO_URI}}
                  STEP_APP_ENV: demo_step_env

              run: |
                  echo "Environment-  $APP_ENV"
                  echo "Port-  $PORT"
                  echo "Database URI- $MONGO_URI and Database Password- $DB_PASSWORD"
                  echo "Global Env- $GLOBAL_APP_ENV, Job Env $GLOBAL_APP_ENV, Step Env- $STEP_APP_ENV"
