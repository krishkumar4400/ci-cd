name: Demo CI Env Secrets

on:
    workflow_dispatch:
    push:

# global (workflow) level env
env:
    GLOBAL_APP_ENV: demo_global_env

jobs:
    build:
        runs-on: ubuntu-latest

        # job level env
        env:
            JOB_APP_ENV: demo_job_env

        steps:
            - name: Say Hello
              run: echo "Hello from second workflow"

            - name: Install
              # step level env
              env:
                  APP_ENV: demo
                  PORT: 3000
                  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
                  MONGO_URI: ${{secrets.MONGO_URI}}
                  STEP_APP_ENV: demo_step_env

              run: |
                  echo "Environment-  $APP_ENV"
                  echo "Port-  $PORT"
                  echo "Database URI- $MONGO_URI and Database Password- $DB_PASSWORD"
                  echo "Global Env- $GLOBAL_APP_ENV, Job Env- $GLOBAL_APP_ENV, Step Env- $STEP_APP_ENV"

            - name: Create Demo File
              run: |
                  echo "Hello from CI Pipeline" > demo.txt
                  echo "File created successfully"
                  mkdir demo_dir
                  touch app.js

            - name: Upload Demo
              uses: actions/upload-artifact@v7
              with:
                  name: build-artifact-demo
                  path: .

# Job dependency and pipeline flow
    test:
        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: Test Job
              run: echo "Test Job"

    independent:
        runs-on: ubuntu-latest
        steps:
            - name: independent job
              run: echo "Independent Job"
